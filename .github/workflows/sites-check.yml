# Pull request checks for both documentation sites. Builds the real VitePress output and
# compares it with the target branch. No deployment, credentials or repository writes.
name: sites-check
on:
  pull_request:
    paths: ['sites/**', 'src/content/prompts.html', 'src/chapters.json', '.github/workflows/sites-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sites-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCS_CMS_BRANCH: ${{ github.head_ref || github.ref_name }}
    defaults:
      run:
        working-directory: sites
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Check formatting
        run: npm run format:check
      - name: Generate both sites and check article targets
        run: |
          node build/index.mjs sub2api newapi
          node tools/check-routes.mjs
      - name: Build both documentation sites
        run: npm run build
      - name: Check each site keeps its own customer-service contact
        run: node tools/check-contacts.mjs
      - name: Compile download index Functions without deploying
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler pages functions build --outdir "${{ runner.temp }}/cos-download-functions"
      # Readers should only see a change when the PR means to make one. Build the base branch
      # the same way and list every page or public file whose content differs.
      - name: Check out base branch for comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Build base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: base/sites
        run: npm ci && npm run build
      - name: Compare build output with base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          echo '## 与目标分支的构建产物对比' >> "$GITHUB_STEP_SUMMARY"
          node tools/compare-dist.mjs ../base/sites/sub2api/.vitepress/dist sub2api/.vitepress/dist --label 'docs-sub.solov.cc'
          node tools/compare-dist.mjs ../base/sites/newapi/.vitepress/dist newapi/.vitepress/dist --label 'docs-new.solov.cc'
      - name: Upload exact static builds
        uses: actions/upload-artifact@v4
        with:
          name: xingmang-sites-${{ github.sha }}
          path: |
            sites/sub2api/.vitepress/dist
            sites/newapi/.vitepress/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
