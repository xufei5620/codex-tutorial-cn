# Production deployment remains limited to main. Merging a reviewed PR may trigger publishing.
name: sites
on:
  push:
    branches: [main]
    paths: ['sites/**', 'src/content/**', 'src/chapters.json', '.github/workflows/sites.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sites-deploy
  cancel-in-progress: false
jobs:
  build-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sites
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/package-lock.json
      - name: Unit and route checks
        run: |
          node --test tools/tests/*.test.mjs studio/tests/*.test.mjs
          node tools/prebuild.mjs sub2api
          node tools/prebuild.mjs newapi
          node tools/check-routes.mjs
      - run: npm ci
      - name: Build both sites
        run: npm run build
      - name: Check final studio routes
        run: node tools/check-routes.mjs
      - name: Deploy docs-sub.solov.cc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy sub2api/.vitepress/dist --project-name docs-sub --branch main --commit-dirty=true
      - name: Deploy docs-new.solov.cc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy newapi/.vitepress/dist --project-name docs-new --branch main --commit-dirty=true
