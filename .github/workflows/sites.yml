# Production deployment remains limited to main. Merging a reviewed PR may trigger publishing.
name: sites
on:
  push:
    branches: [main]
    paths: ['sites/**', 'src/content/prompts.html', 'src/chapters.json', '.github/workflows/sites.yml']
  workflow_dispatch:
  schedule:
    - cron: '31 */6 * * *'
permissions:
  contents: read
concurrency:
  group: sites-deploy
  cancel-in-progress: false
jobs:
  build-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sites
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/package-lock.json
      # Component tests use the exact locked Vue compiler shipped by VitePress.
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and route checks
        run: |
          npm test
          node studio/prepare.mjs sub2api
          node studio/prepare.mjs newapi
          node tools/check-routes.mjs
      - uses: actions/cache/restore@v4
        with:
          path: sites/.cos-index-cache
          key: ${{ runner.os }}-cos-index-mirror-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-cos-index-mirror-v1-
      - name: Prepare validated public indexes
        run: node downloads/mirror.mjs
      - uses: actions/cache/save@v4
        with:
          path: sites/.cos-index-cache
          key: ${{ runner.os }}-cos-index-mirror-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build both sites
        run: npm run build
      - name: Check each site keeps its own customer-service contact
        run: node tools/check-contacts.mjs
      - name: Compile download index Functions without deploying
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler pages functions build --outdir "${{ runner.temp }}/cos-download-functions"
      - name: Check final studio routes
        run: node tools/check-routes.mjs
      - name: Deploy docs-sub.solov.cc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy sub2api/.vitepress/dist --project-name docs-sub --branch main --commit-dirty=true
      - name: Deploy docs-new.solov.cc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy newapi/.vitepress/dist --project-name docs-new --branch main --commit-dirty=true
