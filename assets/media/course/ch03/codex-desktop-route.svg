<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT 桌面应用进入 Codex 的路线示意图</title>
  <desc id="desc">从官方入口、ChatGPT 桌面应用、登录账号到选择 Codex，再核对权限的学习路线。</desc>
  <rect width="960" height="440" rx="24" fill="#f0f7f8"/>
  <text x="48" y="48" fill="#084a51" font-family="sans-serif" font-size="24" font-weight="700">先认路，再操作</text>
  <rect x="42" y="88" width="176" height="112" rx="18" fill="#084a51"/>
  <text x="130" y="134" fill="#ffffff" font-family="sans-serif" font-size="27" font-weight="700" text-anchor="middle">官方入口</text>
  <text x="130" y="166" fill="#dcecee" font-family="sans-serif" font-size="17" text-anchor="middle">下载安装页</text>
  <rect x="264" y="88" width="176" height="112" rx="18" fill="#0e6b74"/>
  <text x="352" y="134" fill="#ffffff" font-family="sans-serif" font-size="27" font-weight="700" text-anchor="middle">ChatGPT</text>
  <text x="352" y="166" fill="#dcecee" font-family="sans-serif" font-size="17" text-anchor="middle">桌面应用</text>
  <rect x="486" y="88" width="176" height="112" rx="18" fill="#0e6b74"/>
  <text x="574" y="134" fill="#ffffff" font-family="sans-serif" font-size="27" font-weight="700" text-anchor="middle">登录</text>
  <text x="574" y="166" fill="#dcecee" font-family="sans-serif" font-size="17" text-anchor="middle">自己的账号</text>
  <rect x="708" y="88" width="210" height="112" rx="18" fill="#084a51"/>
  <text x="813" y="134" fill="#ffffff" font-family="sans-serif" font-size="27" font-weight="700" text-anchor="middle">Codex</text>
  <text x="813" y="166" fill="#dcecee" font-family="sans-serif" font-size="17" text-anchor="middle">产品入口</text>
  <path d="M218 144H250" stroke="#0e6b74" stroke-width="6" stroke-linecap="round"/>
  <path d="M238 130L254 144L238 158" fill="none" stroke="#0e6b74" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M440 144H472" stroke="#0e6b74" stroke-width="6" stroke-linecap="round"/>
  <path d="M460 130L476 144L460 158" fill="none" stroke="#0e6b74" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M662 144H694" stroke="#0e6b74" stroke-width="6" stroke-linecap="round"/>
  <path d="M682 130L698 144L682 158" fill="none" stroke="#0e6b74" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M813 204V266" fill="none" stroke="#9e2f2f" stroke-width="6" stroke-linecap="round"/>
  <path d="M797 266L829 266L813 284Z" fill="#9e2f2f"/>
  <rect x="120" y="282" width="720" height="108" rx="20" fill="#fdefef" stroke="#9e2f2f" stroke-width="3"/>
  <text x="480" y="324" fill="#9e2f2f" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle">权限</text>
  <text x="480" y="357" fill="#6b4c00" font-family="sans-serif" font-size="18" text-anchor="middle">先核对 Ask for approval、项目归属和 Local 文件夹；看不清就停</text>
  <text x="480" y="414" fill="#526b70" font-family="sans-serif" font-size="16" text-anchor="middle">自有绘制流程示意图，不是固定版本的界面截图</text>
</svg>
