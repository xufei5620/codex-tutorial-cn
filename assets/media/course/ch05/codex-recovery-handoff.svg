<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Codex 停止、检查与交接流程示意图</title>
  <desc id="desc">发现风险后停止，确认结束并拒绝审批，检查文件和备份，最后用交接卡安全重开。</desc>
  <rect width="960" height="500" rx="24" fill="#f7fafb"/>
  <text x="48" y="48" fill="#084a51" font-family="sans-serif" font-size="24" font-weight="700">出问题时先保留退路</text>
  <rect x="48" y="92" width="190" height="104" rx="18" fill="#fdefef" stroke="#9e2f2f" stroke-width="3"/>
  <text x="143" y="136" fill="#9e2f2f" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle">停止</text>
  <text x="143" y="168" fill="#6b4c00" font-family="sans-serif" font-size="17" text-anchor="middle">先别继续发消息</text>
  <rect x="278" y="92" width="190" height="104" rx="18" fill="#0e6b74"/>
  <text x="373" y="136" fill="#ffffff" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">确认结束</text>
  <text x="373" y="168" fill="#dcecee" font-family="sans-serif" font-size="17" text-anchor="middle">回复不再追加</text>
  <rect x="508" y="92" width="190" height="104" rx="18" fill="#0e6b74"/>
  <text x="603" y="136" fill="#ffffff" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">拒绝审批</text>
  <text x="603" y="168" fill="#dcecee" font-family="sans-serif" font-size="17" text-anchor="middle">取消意外请求</text>
  <rect x="738" y="92" width="174" height="104" rx="18" fill="#084a51"/>
  <text x="825" y="136" fill="#ffffff" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">检查文件</text>
  <text x="825" y="168" fill="#dcecee" font-family="sans-serif" font-size="17" text-anchor="middle">记录已读/已改</text>
  <path d="M238 144H264" stroke="#0e6b74" stroke-width="6" stroke-linecap="round"/>
  <path d="M254 130L270 144L254 158" fill="none" stroke="#0e6b74" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M468 144H494" stroke="#0e6b74" stroke-width="6" stroke-linecap="round"/>
  <path d="M484 130L500 144L484 158" fill="none" stroke="#0e6b74" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M698 144H724" stroke="#0e6b74" stroke-width="6" stroke-linecap="round"/>
  <path d="M714 130L730 144L714 158" fill="none" stroke="#0e6b74" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M825 196V240H284V258" fill="none" stroke="#0e6b74" stroke-width="6" stroke-linecap="round"/>
  <path d="M268 258L300 258L284 276Z" fill="#0e6b74"/>
  <rect x="154" y="274" width="260" height="106" rx="18" fill="#ffffff" stroke="#0e6b74" stroke-width="3"/>
  <text x="284" y="318" fill="#084a51" font-family="sans-serif" font-size="27" font-weight="700" text-anchor="middle">备份恢复</text>
  <text x="284" y="350" fill="#3d4a53" font-family="sans-serif" font-size="17" text-anchor="middle">先保留现场，再用已核对的备份</text>
  <rect x="546" y="274" width="260" height="106" rx="18" fill="#dcecee" stroke="#084a51" stroke-width="3"/>
  <text x="676" y="318" fill="#084a51" font-family="sans-serif" font-size="27" font-weight="700" text-anchor="middle">交接卡</text>
  <text x="676" y="350" fill="#1b2730" font-family="sans-serif" font-size="17" text-anchor="middle">最新版、限制和下一步只写清一件事</text>
  <path d="M414 327H534" stroke="#0e6b74" stroke-width="6" stroke-linecap="round"/>
  <path d="M516 313L536 327L516 341" fill="none" stroke="#0e6b74" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="430" fill="#526b70" font-family="sans-serif" font-size="16" text-anchor="middle">自有绘制流程示意图；真实界面控件仍需按当前版本实测</text>
</svg>
