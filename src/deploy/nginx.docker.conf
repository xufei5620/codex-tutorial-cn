server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; }
    location ~* \.html$ { add_header Cache-Control "no-cache"; }
    gzip on;
    gzip_types text/html text/css application/json image/svg+xml;
}
