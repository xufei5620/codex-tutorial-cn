# Codex 中文入门教程 —— Nginx 站点配置（纯静态）
# 用法：把本文件放到 /etc/nginx/conf.d/codex-tutorial.conf，
#      把站点文件放到 /var/www/codex-tutorial，然后 nginx -t && nginx -s reload
server {
    listen 80;
    server_name codex.example.com;          # ← 换成你的域名；没有域名就写 _
    root /var/www/codex-tutorial;
    index index.html;
    charset utf-8;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 内容源与点文件（.git 等）即使被复制上来也不对外提供
    location ^~ /src/ { return 404; }
    location ~ /\. { return 404; }

    # 静态资源缓存一周；HTML 不缓存，保证更新后读者立刻看到新版
    location ~* \.(css|svg|png|jpg|zip)$ { expires 7d; add_header Cache-Control "public"; }
    location ~* \.html$ { add_header Cache-Control "no-cache"; }

    # 维护者资料不需要被搜索引擎收录（robots.txt 已声明，这里不再拦截）
    gzip on;
    gzip_types text/html text/css application/json image/svg+xml;
}
