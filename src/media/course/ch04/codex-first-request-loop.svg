<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Codex 第一次请求流程示意图</title>
  <desc id="desc">把任务、范围、材料和期望写清楚，发送前检查，取得结果后做完整复检。</desc>
  <rect width="960" height="500" rx="24" fill="#f7fafb"/>
  <text x="48" y="48" fill="#084a51" font-family="sans-serif" font-size="24" font-weight="700">一次请求也要有检查点</text>
  <rect x="44" y="88" width="188" height="108" rx="18" fill="#084a51"/>
  <text x="138" y="132" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle">任务</text>
  <text x="138" y="164" fill="#dcecee" font-family="sans-serif" font-size="17" text-anchor="middle">要完成什么</text>
  <rect x="258" y="88" width="188" height="108" rx="18" fill="#0e6b74"/>
  <text x="352" y="132" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle">范围</text>
  <text x="352" y="164" fill="#dcecee" font-family="sans-serif" font-size="17" text-anchor="middle">只处理什么</text>
  <rect x="472" y="88" width="188" height="108" rx="18" fill="#0e6b74"/>
  <text x="566" y="132" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle">材料</text>
  <text x="566" y="164" fill="#dcecee" font-family="sans-serif" font-size="17" text-anchor="middle">依据在哪里</text>
  <rect x="686" y="88" width="230" height="108" rx="18" fill="#0e6b74"/>
  <text x="801" y="132" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle">期望</text>
  <text x="801" y="164" fill="#dcecee" font-family="sans-serif" font-size="17" text-anchor="middle">格式与完成标准</text>
  <path d="M232 142H246" stroke="#0e6b74" stroke-width="6" stroke-linecap="round"/>
  <path d="M236 128L252 142L236 156" fill="none" stroke="#0e6b74" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M446 142H460" stroke="#0e6b74" stroke-width="6" stroke-linecap="round"/>
  <path d="M450 128L466 142L450 156" fill="none" stroke="#0e6b74" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M660 142H674" stroke="#0e6b74" stroke-width="6" stroke-linecap="round"/>
  <path d="M664 128L680 142L664 156" fill="none" stroke="#0e6b74" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M801 196V238" stroke="#9e2f2f" stroke-width="6" stroke-linecap="round"/>
  <path d="M801 230L785 246H817Z" fill="#9e2f2f"/>
  <rect x="296" y="258" width="410" height="78" rx="18" fill="#fdefef" stroke="#9e2f2f" stroke-width="3"/>
  <text x="501" y="306" fill="#9e2f2f" font-family="sans-serif" font-size="27" font-weight="700" text-anchor="middle">发送前检查</text>
  <path d="M501 336V354H247V366" fill="none" stroke="#0e6b74" stroke-width="6" stroke-linecap="round"/>
  <path d="M231 366L263 366L247 384Z" fill="#0e6b74"/>
  <rect x="132" y="386" width="230" height="72" rx="18" fill="#dcecee" stroke="#084a51" stroke-width="3"/>
  <text x="247" y="431" fill="#084a51" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">结果</text>
  <rect x="598" y="386" width="230" height="72" rx="18" fill="#084a51"/>
  <text x="713" y="431" fill="#ffffff" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">完整复检</text>
  <path d="M362 422H580" stroke="#0e6b74" stroke-width="6" stroke-linecap="round"/>
  <path d="M562 408L582 422L562 436" fill="none" stroke="#0e6b74" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="486" fill="#526b70" font-family="sans-serif" font-size="16" text-anchor="middle">自有绘制流程示意图；第一版结果不等于最终答案</text>
</svg>
